<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gebeya Go</title>
  <link rel="stylesheet" href="/brand.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--cream); color: var(--ink); font-family: var(--font); padding: 24px; text-align: center; }
    .box { max-width: 360px; }
    img { width: 72px; height: 72px; border-radius: 50%; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: var(--hint); margin: 0 0 20px; line-height: 1.5; }
    a { display: inline-block; background: var(--brand); color: var(--brand-text); padding: 14px 24px; border-radius: 14px; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/brand/logo.png" alt="">
    <h1>Back to Gebeya Go</h1>
    <p>Your payment is being checked. Open Telegram to see your order. It updates by itself in a minute or two.</p>
    <a id="go" href="https://t.me/">Open Telegram</a>
  </div>
  <script src="/return.js"></script>
</body>
</html>
